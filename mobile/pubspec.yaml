name: auth_levels
description: "auth-levels companion: TOTP authenticator, push-login approval, security activity."
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.1
  dio: ^5.11.1
  dart_dash_otp: ^2.0.0
  flutter_secure_storage: ^11.1.1
  uuid: ^4.6.0
  mobile_scanner: ^7.4.1
  app_settings: ^9.0.0
  device_info_plus: ^13.2.0
  package_info_plus: ^10.2.1
  firebase_core: ^4.14.0
  firebase_app_installations: ^0.4.3
  firebase_messaging: ^16.6.0
  flutter_local_notifications: ^22.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Contract stub, served in-process by the API integration tests.
  stub_server:
    path: tool/stub_server
  shelf: ^1.4.2

flutter:
  uses-material-design: true
