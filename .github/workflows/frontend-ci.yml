name: Frontend CI

on:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: '1'

      # pnpm must be on PATH before setup-node so its cache resolver works.
      - name: Set Up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Set Up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      # Runs vite build, then tsc --noEmit.
      - name: Build and Typecheck
        run: pnpm build

      - name: Lint
        run: pnpm lint
