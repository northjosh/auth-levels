name: Backend CI

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: '1'

      - name: Set Up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: 'temurin'
          cache: 'maven'

      - name: Build and Test
        # application.properties binds resend.apikey to ${RESEND_API_KEY} with
        # no default, so the Spring context will not start without it. Tests
        # must never send real email, so this is a deliberate dummy rather
        # than a repository secret.
        env:
          RESEND_API_KEY: ci-placeholder-not-a-real-key
        run: mvn -B verify
