name: Continuous Integration
on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - 'src/**'
      - 'pom.xml'
  workflow_dispatch:


jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: '1'

      - name: Set Up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: 'temurin'
          cache: 'maven'

      - name: Build and Test
        run: |
          mvn -B verify
